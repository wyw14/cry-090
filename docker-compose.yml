services:
  app:
    build:
      context: .
      args:
        TARGETARCH: amd64
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://salsa:salsa@db:5432/salsa?sslmode=disable
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt: ["no-new-privileges:true"]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: salsa
      POSTGRES_PASSWORD: salsa
      POSTGRES_DB: salsa
    volumes: ["salsa-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salsa -d salsa"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  salsa-data:
